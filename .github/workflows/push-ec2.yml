name: Deploy to EC2

on:
  workflow_call:

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME || github.event.repository.name }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          EC2_IP_LIVE_HOST: ${{ secrets.EC2_IP_LIVE_HOST }}
          EC2_IP_PBE_HOST: ${{ secrets.EC2_IP_PBE_HOST }}
          EC2_SSH_KEY_LIVE: ${{ secrets.EC2_SSH_KEY_LIVE }}
          EC2_SSH_KEY_PBE: ${{ secrets.EC2_SSH_KEY_PBE }}
        run: |
          mkdir -p ~/.ssh
          if [ "$BRANCH_NAME" = "live" ]; then
            echo "$EC2_SSH_KEY_LIVE" > ~/.ssh/deploy_key
            ssh-keyscan -H "$EC2_IP_LIVE_HOST" >> ~/.ssh/known_hosts
          else
            echo "$EC2_SSH_KEY_PBE" > ~/.ssh/deploy_key
            ssh-keyscan -H "$EC2_IP_PBE_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          EC2_IP_LIVE_HOST: ${{ secrets.EC2_IP_LIVE_HOST }}
          EC2_IP_PBE_HOST: ${{ secrets.EC2_IP_PBE_HOST }}
        run: |
          if [ "$BRANCH_NAME" = "live" ]; then
            HOST="root@$EC2_IP_LIVE_HOST"
            PROJECT_DIR="/root/properties"
          else
            HOST="root@$EC2_IP_PBE_HOST"
            PROJECT_DIR="/root/property"
          fi

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              $HOST << ENDSSH
            set -e

            cd $PROJECT_DIR

            git pull origin $BRANCH_NAME

            npm install

            if [ -f tsconfig.json ]; then
              echo "[deploy] TypeScript — building"
              npm run build
            else
              echo "[deploy] JavaScript — skipping build"
            fi

            pm2 reload ecosystem.config.cjs --only $PROJECT_NAME

            pm2 save

            echo "[deploy] Done"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
